[package]
name = "{{ project_name }}"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

stm32f4xx-hal = { version = "0.23.0", features = ["{{ chip | truncate(length=chip | length - 2, end="") }}", "defmt"] }

defmt = "1.0"
defmt-rtt = "1.1"

panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.release]
debug = 2
